name: Publish to npm

# Publishes with npm provenance when a GitHub Release is published.
# Requires an NPM_TOKEN secret (automation token) in the repo settings.
# Runs for every release except extension releases (extension-v<version>),
# which extension-release.yml handles; the tag must be v followed by the
# version in the root package.json.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    if: ${{ !startsWith(github.event.release.tag_name, 'extension-v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
      - name: Check the release tag matches package.json
        run: |
          expected="v$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::Release tag $TAG does not match package.json version ($expected)"
            exit 1
          fi
        env:
          TAG: ${{ github.event.release.tag_name }}
      - run: npm ci
      - run: npm run build
      - run: npm test
      # --provenance is redundant with publishConfig.provenance but kept explicit.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
