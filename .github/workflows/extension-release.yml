name: Attach extension zips to release

# Builds the browser extension and uploads the Chromium and Firefox zips to the
# GitHub Release, so users can install it without cloning the repository.
# Runs for extension releases only: the tag is extension-v followed by the
# version in extension/package.json. Server releases (v<version>) are handled
# by publish.yml.
on:
  release:
    types: [published]

permissions:
  contents: write # required to upload release assets

jobs:
  extension:
    if: startsWith(github.event.release.tag_name, 'extension-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the release tag matches extension/package.json
        run: |
          expected="extension-v$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::Release tag $TAG does not match extension/package.json version ($expected)"
            exit 1
          fi
        env:
          TAG: ${{ github.event.release.tag_name }}
      - run: npm ci
      - run: npm run build
      - run: npm run package
      - run: gh release upload "$TAG" dist/*.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
